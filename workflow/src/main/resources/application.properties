spring.application.name=workflow

management.endpoints.web.exposure.include=*

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workflow_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# HMAC key for signing JWTs, at least 32 bytes. Generate one with: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
# Databases created before Flyway already have the V1 tables: record them as V1 instead of failing
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer